name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish
        required: true
        type: string

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI verifies this workflow's OIDC identity, so no API token
    # is stored anywhere. Requires a publisher configured on PyPI for this repository.
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.9"

      - name: Build distributions
        run: uv build

      - name: Check metadata renders on PyPI
        run: uvx twine check dist/*

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
