name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.9"

      - name: Install
        run: uv sync --all-groups

      - name: Check
        run: |
          uv run ruff check
          uv run ruff format --check
          uv run pyright

  decoupled:
    name: No crawler import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.9"

      # This package is the crawler's next core, not a feature of it. Keeping the
      # dependency out is what makes that swap a deletion rather than a rewrite, so it is
      # asserted twice: statically over every import, and by importing with nothing else
      # installed.
      - name: Assert nothing imports the crawler
        run: uv run --no-dev pytest tests/test_decoupling.py -q

      - name: Import with only runtime dependencies present
        run: uv run --no-dev python -c "import sourcelib; print(sourcelib.__version__)"

  build:
    name: Test and build (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: uv sync --all-groups

      - name: Test
        run: uv run pytest -q

      - name: Build
        run: uv build

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.python-version }}
          path: dist/
          retention-days: 30
